apiVersion: serving.local-ome.com/v1
kind: LocalInferenceService
metadata:
  name: deployed-model
  namespace: default
spec:
  runtime: sglang
  model:
    uri: "facebook/opt-125m"
    name: "Deployed Model"
  settings:
    batchSize: 1
    precision: fp16
    maxTokens: 100
  scaling:
    replicas: 1